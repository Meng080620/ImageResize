<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Guard window.fetch from throwing read-only setter errors in specific sandbox environments
      (function() {
        try {
          var originalFetch = window.fetch;
          var storedFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return storedFetch;
            },
            set: function(value) {
              storedFetch = value;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn("Smart Resizer window.fetch alignment bypass hook failed", e);
        }
      })();
    </script>
    <title>Smart Image Resizer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
